                            <div class="w-20 h-20 bg-labGreen/20 text-labGreen rounded-full mx-auto flex items-center justify-center text-4xl border border-labGreen/50 animated-node">
                                <i class="fa-solid fa-award"></i>
                            </div>

                            <h2 class="text-4xl font-display font-black tracking-tight">
                                YOU ARE NOW AN <br/><span class="text-transparent bg-clip-text bg-gradient-to-r from-labCyan via-labBlue to-labGreen">AI DETECTIVE!</span>
                            </h2>

                            <div class="grid grid-cols-4 gap-2 text-center text-xs font-mono">
                                <div class="bg-white/10 p-2.5 rounded-xl border border-white/10 text-labCyan">SEE</div>
                                <div class="bg-white/10 p-2.5 rounded-xl border border-white/10 text-labBlue">UNDERSTAND</div>
                                <div class="bg-white/10 p-2.5 rounded-xl border border-white/10 text-labOrange">PREDICT</div>
                                <div class="bg-white/10 p-2.5 rounded-xl border border-white/10 text-labGreen">DISCOVER</div>
                            </div>

                            <p class="text-sm text-slate-300">
                                “NOVA has learned how to read data, find patterns, and make smart predictions. Great job AI Detectives!”
                            </p>
                        </div>

                        <div class="relative z-10 text-xs font-mono text-slate-400">
                            THANK YOU! SEE YOU IN THE NEXT AI LABORATORY SESSION!
                        </div>
                    </div>
                `
            }
        ];

        let currentSlideIndex = 0;
        let speakerNotesOpen = false;

        function renderSlide(index) {
            const slide = slides[index];
            const container = document.getElementById('slideContainer');
            
            // Re-trigger animation
            container.classList.remove('slide-enter');
            void container.offsetWidth; // Force reflow
            container.classList.add('slide-enter');

            container.innerHTML = slide.content;

            // Update Headers & Controls
            document.getElementById('currentSlideNum').innerText = index + 1;
            document.getElementById('totalSlidesNum').innerText = slides.length;

            document.getElementById('prevBtn').disabled = (index === 0);
            document.getElementById('nextBtn').disabled = (index === slides.length - 1);

            // Update Speaker Notes
            document.getElementById('noteObjective').innerText = slide.notes.objective;
            document.getElementById('noteTeacherAction').innerText = slide.notes.teacherAction;
            document.getElementById('noteStudentAction').innerText = slide.notes.studentAction;
            document.getElementById('noteReveal').innerText = slide.notes.reveal;
            document.getElementById('noteTime').innerText = slide.notes.time;
        }

        function nextSlide() {
            if (currentSlideIndex < slides.length - 1) {
                currentSlideIndex++;
                renderSlide(currentSlideIndex);
            }
        }

        function prevSlide() {
            if (currentSlideIndex > 0) {
                currentSlideIndex--;
                renderSlide(currentSlideIndex);
            }
        }

        function goToSlide(index) {
            currentSlideIndex = index;
            renderSlide(currentSlideIndex);
            toggleOverviewModal(false);
        }

        function toggleSpeakerNotes() {
            const drawer = document.getElementById('speakerNotesDrawer');
            const btn = document.getElementById('notesToggleBtn');
            speakerNotesOpen = !speakerNotesOpen;
            
            if (speakerNotesOpen) {
                drawer.classList.remove('hidden');
                btn.classList.add('bg-labPurple/20', 'border-labPurple');
            } else {
                drawer.classList.add('hidden');
                btn.classList.remove('bg-labPurple/20', 'border-labPurple');
            }
        }

        function toggleOverviewModal(forceState) {
            const modal = document.getElementById('overviewModal');
            const shouldShow = forceState !== undefined ? forceState : modal.classList.contains('hidden');
            
            if (shouldShow) {
                renderSlideGrid();
                modal.classList.remove('hidden');
                modal.classList.add('flex');
            } else {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }
        }

        function renderSlideGrid() {
            const grid = document.getElementById('slideGrid');
            grid.innerHTML = '';
            
            slides.forEach((slide, idx) => {
                const item = document.createElement('div');
                item.className = `p-3 rounded-xl border text-xs font-mono cursor-pointer transition-all flex flex-col justify-between ${idx === currentSlideIndex ? 'bg-labBlue text-white border-labBlue font-bold shadow-lg' : 'bg-white text-labNavy border-labBorder hover:border-labBlue'}`;
                item.onclick = () => goToSlide(idx);
                item.innerHTML = `
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-[10px] opacity-75">SLIDE ${idx + 1}</span>
                        <span class="text-[9px] uppercase px-1.5 py-0.5 rounded ${idx === currentSlideIndex ? 'bg-white/20 text-white' : 'bg-slate-100 text-slate-700'}">${slide.tag}</span>
                    </div>
                    <div class="font-bold line-clamp-2 text-left">${slide.title}</div>
                `;
                grid.appendChild(item);
            });
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => alert("Fullscreen error: " + err.message));
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        function revealGameAnswer(button, isCorrect) {
            const box = document.getElementById('gameAnswerBox');
            if (box) box.classList.remove('hidden');
        }

        function toggleClusteringVisual(btn) {
            const unclustered = document.getElementById('dotsUnclustered');
            const clustered = document.getElementById('dotsClustered');
            if (unclustered && clustered) {
                unclustered.classList.toggle('hidden');
                clustered.classList.toggle('hidden');
            }
        }

        function revealCardAnswer(cardElement, techniqueName) {
            const ansSpan = cardElement.querySelector('.card-ans');
            if (ansSpan) {
                ansSpan.classList.remove('hidden');
            }
        }

        function copyAiPrompt() {
            const promptText = document.getElementById('promptText').innerText;
            const textarea = document.createElement('textarea');
            textarea.value = promptText;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            
            alert('✓ AI Tool Prompt copied to clipboard! Paste it into ChatGPT or Google Gemini.');
        }

        // Keyboard Controls
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') {
                nextSlide();
            } else if (e.key === 'ArrowLeft') {
                prevSlide();
            } else if (e.key === 'f' || e.key === 'F') {
                toggleFullscreen();
            } else if (e.key === 'n' || e.key === 'N') {
                toggleSpeakerNotes();
            }
        });

        // Initialize presentation
        window.onload = function() {
            renderSlide(0);
        };
    </script>
</body>
</html>
